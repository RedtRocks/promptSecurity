# Benign trajectories RECORDED from a live agent (not hand-authored).
# Regenerate with scripts/record_benign_trajectories.py
tool_name: web_search
provenance: recorded
tasks:
- task_id: search-docs
  description: Look up documentation for a library.
  prompt: Look up documentation for a library.
  tool_calls:
  - tool_name: web_search
    parameters:
      query: documentation for a library
      num_results: 5
    success: true
    response: '[simulated] web_search executed with {''query'': ''documentation for
      a library'', ''num_results'': 5}'
- task_id: search-news
  description: Find recent public news on a topic.
  prompt: Find recent public news on a topic.
  tool_calls:
  - tool_name: web_search
    parameters:
      query: recent news
      num_results: 3
    success: true
    response: '[simulated] web_search executed with {''query'': ''recent news'', ''num_results'':
      3}'
- task_id: search-howto
  description: Find a how-to guide.
  prompt: Find a how-to guide.
  tool_calls:
  - tool_name: web_search
    parameters:
      query: how to guide
      num_results: 5
    success: true
    response: '[simulated] web_search executed with {''query'': ''how to guide'',
      ''num_results'': 5}'
recording_notes:
  n_source_tasks: 3
  n_recorded: 3
  n_dropped: 0
  dropped: []
  agent_endpoint: http://127.0.0.1:8080
  agent_model_env: see AGENT_LLM_MODEL on the agent server
