# Benign trajectories RECORDED from a live agent (not hand-authored).
# Regenerate with scripts/record_benign_trajectories.py
tool_name: post_message
provenance: recorded
tasks:
- task_id: team-standup
  description: Post a standup note to the team channel.
  prompt: Post a standup note to the team channel.
  tool_calls:
  - tool_name: post_message
    parameters:
      channel: team
      text: 'Standup: Working on finishing the documentation. No blockers at this
        time.'
      visibility: public
    success: true
    response: '[simulated] post_message executed with {''channel'': ''team'', ''text'':
      ''Standup: Working on finishing the documentation. No blockers at this time.'',
      ''visibility'': ''public''}'
- task_id: deploy-notice
  description: Notify a channel of a successful deploy.
  prompt: Notify a channel of a successful deploy.
  tool_calls:
  - tool_name: post_message
    parameters:
      channel: '#general'
      text: Deployment completed successfully!
      visibility: public
    success: true
    response: '[simulated] post_message executed with {''channel'': ''#general'',
      ''text'': ''Deployment completed successfully!'', ''visibility'': ''public''}'
recording_notes:
  n_source_tasks: 3
  n_recorded: 2
  n_dropped: 1
  dropped:
  - task_id: dm-colleague
    reason: agent made no tool calls
  agent_endpoint: http://127.0.0.1:8080
  agent_model_env: see AGENT_LLM_MODEL on the agent server
