name: post_message
description: Post a message to a chat channel or social platform
inputSchema:
  type: object
  properties:
    channel:
      type: string
      description: Target channel, group, or handle
    text:
      type: string
      description: Message text to post
    visibility:
      type: string
      description: Post visibility
      enum: [public, private, direct]
  required:
  - channel
  - text
