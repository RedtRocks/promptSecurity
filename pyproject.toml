[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-hardener"
version = "0.1.0"
description = "Autonomous security pipeline for hardening AI agent tool deployments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
  "litellm>=1.40",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "jinja2>=3.1",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy", "fastapi>=0.100", "uvicorn>=0.20"]

[project.scripts]
agent-hardener = "agent_hardener.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hardener"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
