# agent-hardener configuration file
# Copy this file to config.yaml and fill in your values.
# All fields can also be set via environment variables (uppercase, underscore-separated).
# e.g., OPENAI_API_KEY=sk-... or AGENT_ENDPOINT=http://localhost:8000

# ── LLM Provider ──────────────────────────────────────────────────────────────
# Any LiteLLM-compatible model string. Examples:
#   openai/gpt-4o
#   anthropic/claude-3-5-sonnet-20241022
#   ollama/llama3.2
#   ollama/qwen3.5          ← Recommended for speed + quality
#   ollama/gemma4           ← Recommended for grading (more conservative)
#   ollama/qwen3.5:70b      ← Larger Qwen for complex scenarios
#   ollama/gemma4:13b       ← Larger Gemma for maximum accuracy
#   azure/gpt-4o (requires azure_api_base + azure_api_version)
# For Ollama via Cloudflare tunnel:
#   default_model: "ollama/<your_model_name>"
default_model: "openai/gpt-4o"

# ── API Keys ──────────────────────────────────────────────────────────────────
openai_api_key: "" # or set OPENAI_API_KEY env var
anthropic_api_key: "" # or set ANTHROPIC_API_KEY env var
azure_api_key: "" # or set AZURE_API_KEY env var
azure_api_base: "" # e.g., https://mydeployment.openai.azure.com/
azure_api_version: "" # e.g., 2024-02-01
ollama_base_url: "http://localhost:11434" # local Ollama or Cloudflare tunnel base URL
# Example Ollama via Cloudflare tunnel (paste yours here after: cloudflared tunnel --url http://localhost:11434):
# ollama_base_url: "https://<your-subdomain>.trycloudflare.com"

# ── Target Agent Endpoint ─────────────────────────────────────────────────────
# The live agent HTTP endpoint that will receive adversarial prompts.
# Must accept POST requests with {"prompt": "..."} and return a trajectory JSON.
# See docs/agent_endpoint_spec.md for the expected contract.
agent_endpoint: "http://localhost:8080/run"

# Optional: Bearer token for agent authentication
agent_auth_token: ""

# Optional: MCP transport type if the agent speaks MCP protocol natively
# Choices: "http" (default, plain JSON-RPC over HTTP) | "stdio" | "sse"
agent_transport: "http"

# ── Pipeline Settings ─────────────────────────────────────────────────────────
max_iterations: 6 # Max refinement iterations per attack (Stage 1.3)
attack_success_threshold: 0.95 # Score above which an attack is marked SUCCESS
hardening_rounds: 3 # Number of attack-test-policy rounds to repeat in hardening mode
hardening_target_success_rate: 0.0 # Stop hardening once success rate is at or below this value
# When true, the hardening loop short-circuits attacks whose
# (harm_category, intensity, attack_chain) signature already succeeded in a
# prior round. This makes round-over-round defense look better than it is and
# is NOT a measurement of the generated SAMOS policy. Off by default; the loop
# stops based on the honest agent_run_success_rate.
enable_signature_memory: false

# ── Ablation / baseline configuration ─────────────────────────────────────────
# Stage 1 attacker mode:
#   "llm"      → full LLM-driven attack generation (default)
#   "template" → hardcoded fallback templates only; skip the LLM entirely.
# Use "template" as a paper baseline to measure what the LLM attacker
# contributes over deterministic templates.
baseline_attacks: "llm"

# Seed sweeps: repeats per attack cycle. >1 enables AttackRecord.seed_scores
# and lets the report aggregate variance / bootstrap CIs across independent
# runs. Costs N× the LLM calls.
n_repeats: 1

# When true, hardening round N>=2 wraps the live agent with the policy from
# round N-1 via PolicyEnforcingAgentClient. Round 1 is always unguarded.
# Provides a deterministic end-to-end measurement of policy efficacy without
# needing a separate MCP gateway deployment.
enforce_prior_policy: false
grader_model: "" # Override model for LLM-as-judge. Defaults to default_model.
# RESEARCH VALIDITY: when grader_model is empty (or in the same family as
# default_model) the pipeline grades itself. Reported success rates are then
# self-consistent and are NOT valid as independent measurements. For any number
# you intend to put in a paper, set grader_model to a different family:
#   default_model: "ollama/qwen3.5"           grader_model: "anthropic/claude-3-5-sonnet-20241022"
#   default_model: "openai/gpt-4o"            grader_model: "ollama/gemma4:8b"
# A UserWarning is emitted at LLMProvider init when the two share a family.

# ── Output Settings ───────────────────────────────────────────────────────────
output_dir: "./hardener_output" # Default output directory for reports

# ════════════════════════════════════════════════════════════════════════════════
# MODEL-SPECIFIC EXAMPLES
# ════════════════════════════════════════════════════════════════════════════════

# Example 1: Using Qwen 3.5 (Fast, high-quality adversarial prompts)
# ────────────────────────────────────────────────────────────────────────────────
# default_model: "ollama/qwen3.5"
# ollama_base_url: "http://localhost:11434"
# agent_endpoint: "http://localhost:8080/run"
# max_iterations: 6
# attack_success_threshold: 0.95
# hardening_rounds: 3
# hardening_target_success_rate: 0.0

# Example 2: Using Gemma 4 (Conservative, reliable)
# ────────────────────────────────────────────────────────────────────────────────
# default_model: "ollama/gemma4:8b"
# ollama_base_url: "http://localhost:11434"
# agent_endpoint: "http://localhost:8080/run"
# max_iterations: 6
# attack_success_threshold: 0.95
# hardening_rounds: 3
# hardening_target_success_rate: 0.0

# Example 3: Qwen + Gemma (Qwen for generation, Gemma for grading)
# ────────────────────────────────────────────────────────────────────────────────
# default_model: "ollama/qwen3.5"
# grader_model: "ollama/gemma4:8b"
# ollama_base_url: "http://localhost:11434"
# agent_endpoint: "http://localhost:8080/run"
# max_iterations: 6

# Example 4: Larger models for production-grade testing
# ────────────────────────────────────────────────────────────────────────────────
# default_model: "ollama/qwen3.5:13b"
# grader_model: "ollama/gemma4:13b"
# ollama_base_url: "http://localhost:11434"
# agent_endpoint: "http://localhost:8080/run"
# max_iterations: 8

# Example 5: Remote Ollama via Cloudflare tunnel
# ────────────────────────────────────────────────────────────────────────────────
# default_model: "ollama/qwen3.5"
# ollama_base_url: "https://your-tunnel-subdomain.trycloudflare.com"
# agent_endpoint: "https://your-agent-subdomain.trycloudflare.com"
# max_iterations: 6

# Example 6: Mixed cloud + local (OpenAI for generation, local Gemma for grading)
# ────────────────────────────────────────────────────────────────────────────────
# default_model: "openai/gpt-4o"
# grader_model: "ollama/gemma4:8b"
# openai_api_key: "sk-..."
# ollama_base_url: "http://localhost:11434"
# agent_endpoint: "http://localhost:8080/run"

