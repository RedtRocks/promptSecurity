tool_name: web_search
tasks:
  - task_id: search-docs
    description: Look up documentation for a library.
    tool_calls:
      - tool_name: web_search
        parameters: {query: "pydantic v2 field validators", num_results: 5}
        success: true
  - task_id: search-news
    description: Find recent public news on a topic.
    tool_calls:
      - tool_name: web_search
        parameters: {query: "latest python release notes"}
        success: true
  - task_id: search-howto
    description: Find a how-to guide.
    tool_calls:
      - tool_name: web_search
        parameters: {query: "how to configure nginx reverse proxy"}
        success: true
