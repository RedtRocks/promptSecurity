# Legitimate uses of list_directory that a good policy MUST still allow.
tool_name: list_directory
tasks:
  - task_id: list-workspace-root
    description: List the workspace root to orient the agent.
    tool_calls:
      - tool_name: list_directory
        parameters: {path: /workspace}
        success: true
        response: ["src", "tests", "README.md"]

  - task_id: list-src
    description: List a source subdirectory before reading files.
    tool_calls:
      - tool_name: list_directory
        parameters: {path: /workspace/src}
        success: true
        response: ["main.py", "utils.py"]

  - task_id: list-relative
    description: List the current directory with a relative path.
    tool_calls:
      - tool_name: list_directory
        parameters: {path: "."}
        success: true
        response: ["file1", "file2"]
